name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Package VS Code extension (repo root IS the extension — no more
      # separate grammar/vscode/chrome subdirectories; chrome moved to
      # almide-chrome-extension)
      - name: Package vsix
        run: |
          npm install -g @vscode/vsce
          vsce package

      # Get version from package.json
      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Create or update release
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: |
            *.vsix
          make_latest: true
